database:
  image: gvenzl/oracle-xe:latest
  ports:
    - "1521:1521"
  environment:
    - ORACLE_PASSWORD=parola123
  volumes:
    - oracle_data:/opt/oracle/oradata
    - ./oracle_setup_scripts:/opt/oracle/scripts/startup
  restart: unless-stopped
  healthcheck: 
    test: ["CMD-SHELL", "echo 'select 1 from dual;' | sqlplus -S system/parola123@//localhost:1521/XE"]
    interval: 15s
    timeout: 10s
    retries: 30
    start_period: 3m