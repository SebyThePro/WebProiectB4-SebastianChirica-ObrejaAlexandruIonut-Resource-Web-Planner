services:
  backend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_USER=proiect_consumabile
      - DB_PASSWORD=parola123
      - DB_CONNECT_STRING=database/XE
    restart: unless-stopped

  database:
    image: gvenzl/oracle-xe:latest
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=parola123
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | sqlplus -S system/parola123@//localhost:1521/XE"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 3m

volumes:
  oracle_data: