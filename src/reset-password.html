<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Resetare Parola - Gestionare Consumabile</title>
    <link rel="stylesheet" href="css/styles.css"> <style>
        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            padding: 0;
        }
        .xp-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="xp-body">
    <div class="auth-container">
        <div class="xp-window">
            <div class="xp-window-title-bar">
                <span class="xp-title-text">Seteaza Parola Noua</span>
            </div>
            <div class="xp-window-content">
                <div id="reset-password-error" class="form-error-message xp-error-message" style="display:none;"></div>
                <div id="reset-password-success" class="form-success-message" style="display:none; background-color: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; padding: 8px 10px; margin-bottom: 12px; border-radius: 2px; font-size: 0.9em;"></div>
                
                <input type="hidden" id="reset-token"> <div>
                    <label for="new-password">Parola Noua:</label>
                    <input type="password" id="new-password" class="xp-input" placeholder="Introdu parola noua">
                </div>
                <div>
                    <label for="confirm-new-password">Confirma Parola Noua:</label>
                    <input type="password" id="confirm-new-password" class="xp-input" placeholder="Confirma parola noua">
                </div>
                <div class="xp-button-group" style="justify-content: center;">
                    <button id="reset-password-button" class="xp-button">Reseteaza Parola</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script> </body>
</html>
