<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Autentificare - Gestionare Consumabile</title>
    <link rel="stylesheet" href="css/styles.css"> <style>
        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            padding: 0; 
        }
        .xp-body { 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px; 
            box-sizing: border-box;
        }
    </style>
</head>
<body class="xp-body">
    <div class="auth-container">
        <div class="xp-window">
            <div class="xp-window-title-bar">
                <span class="xp-title-text">Autentificare Utilizator</span>
            </div>
            <div class="xp-window-content">
                <div id="login-modal-error" class="form-error-message xp-error-message" style="display:none;"></div>
                <div>
                    <label for="login-identifier">Email sau Nume Utilizator:</label>
                    <input type="text" id="login-identifier" class="xp-input" placeholder="Email sau Username">
                </div>
                <div>
                    <label for="login-password">Parola:</label>
                    <input type="password" id="login-password" class="xp-input" placeholder="Parola">
                </div>
                <div class="xp-button-group" style="justify-content: center;">
                    <button id="login-button" class="xp-button">Autentificare</button>
                </div>
                <div style="text-align: center; margin-top: 15px; font-size: 0.9em;">
                    Nu ai cont? <a href="register.html">Inregistreaza-te aici</a>
                    <br>
                    <a href="#" id="open-forgot-password-link" style="display: block; margin-top: 10px;">Am uitat parola</a>
                </div>
            </div>
        </div>
    </div>

    <div id="forgot-password-modal" class="modal-overlay" style="display:none;">
        <div class="xp-window" style="min-width: 350px;">
            <div class="xp-window-title-bar">
                <span class="xp-title-text">Resetare Parola</span>
                <div class="xp-window-controls">
                    <button class="xp-window-control-button close-button" id="close-forgot-password-modal-button" title="Inchide"><span>&times;</span></button>
                </div>
            </div>
            <div class="xp-window-content">
                <p>Introduceti adresa de email asociata contului pentru a primi instructiuni de resetare.</p>
                <div id="forgot-password-modal-error" class="form-error-message xp-error-message" style="display:none;"></div>
                <div id="forgot-password-modal-success" class="form-success-message" style="display:none; background-color: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; padding: 8px 10px; margin-bottom: 12px; border-radius: 2px; font-size: 0.9em;"></div>
                <div>
                    <label for="forgot-password-email">Adresa Email:</label>
                    <input type="email" id="forgot-password-email" class="xp-input" placeholder="exemplu@domeniu.com">
                </div>
                <div class="xp-button-group">
                    <button id="forgot-password-button" class="xp-button">Trimite Instructiuni</button>
                    <button class="xp-button cancel-button" id="cancel-forgot-password-modal-button">Anuleaza</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script> </body>
</html>
