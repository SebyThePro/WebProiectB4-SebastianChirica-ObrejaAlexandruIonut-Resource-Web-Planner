<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Import / Export Date</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .container { max-width: 600px; margin: 40px auto; }
        .xp-button i { margin-right: 8px; }
    </style>
</head>
<body class="xp-body">
    <div class="container">
        <div class="xp-window">
            <div class="xp-window-title-bar">
                <span class="xp-title-text">Import / Export Date</span>
            </div>
            <div class="xp-window-content">
                
                <fieldset class="xp-group-box">
                    <legend class="xp-group-box-title">Export</legend>
                    <p>Descarca toate datele contului tau (depozite si produse) intr-unul din formatele de mai jos.</p>
                    <div class="xp-button-group" style="justify-content: center;">
                        <button id="export-json-btn" class="xp-button">
                            <i class="fas fa-file-code"></i>Exporta ca JSON
                        </button>
                        <button id="export-csv-btn" class="xp-button">
                            <i class="fas fa-file-csv"></i>Exporta ca CSV
                        </button>
                        <button id="export-xml-btn" class="xp-button">
                            <i class="fas fa-file-alt"></i>Exporta ca XML
                        </button>
                    </div>
                </fieldset>

                <fieldset class="xp-group-box">
                    <legend class="xp-group-box-title">Import</legend>
                    <p>Alege formatul, apoi lipeste continutul in caseta de text. ATENTIE: Acest proces va adauga date noi.</p>

                    <div id="import-error-message" class="form-error-message xp-error-message" style="display:none;"></div>
                    <div id="import-success-message" class="form-success-message" style="display:none; background-color: #D4EDDA; color: #155724;"></div>

                    <label for="import-format-select">Format Fisier:</label>
                   <select id="import-format-select" class="xp-select">
                        <option value="json">JSON</option>
                        <option value="csv">CSV</option>
                        <option value="xml">XML</option> </select>
                    </select>

                    <textarea id="import-data-textarea" class="xp-input" rows="10" placeholder="Lipeste continutul JSON ,CSV sau XML aici..."></textarea>

                    <div class="xp-button-group" style="justify-content: center;">
                        <button id="import-btn" class="xp-button">
                            <i class="fas fa-upload"></i>Importa Date
                        </button>
                    </div>
                </fieldset>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a href="index.html">Inapoi la pagina principala</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/import-export.js"></script>
</body>
</html>
